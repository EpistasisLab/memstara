# Memstara's own database.
#
# The board and the results table used to live inside core's `agentic_core` database,
# separated only by an `memstara_` name prefix. That was wrong: Memstara is meant to be an
# application that owns its own store, not a guest in core's. Sharing a server also
# means core's container going down takes Memstara's data with it, and a `docker volume
# rm` aimed at core would destroy results that have nothing to do with core.
#
# So: separate container, separate port, separate volume, separate account.
#
#     docker compose up -d
#     psql postgresql://memstara:memstara@localhost:5463/memstara
#
# The port is 5463 because core already holds 5453. Neither is the Postgres default,
# so a stray client cannot land on the wrong one by accident.

services:
  postgres:
    image: postgres:16-alpine
    container_name: memstara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: memstara
      POSTGRES_PASSWORD: memstara
      POSTGRES_DB: memstara
    ports:
      - "5463:5432"
    volumes:
      - memstara_postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Without this the pipeline can start against a server that is still replaying
      # WAL, and the first claim_task fails with a connection error that reads like a
      # configuration problem.
      test: ["CMD-SHELL", "pg_isready -U memstara -d memstara"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  memstara_postgres_data:
    name: memstara_postgres_data
