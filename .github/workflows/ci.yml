name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-recovery:
    name: Isolated container recovery
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - run: uv sync --frozen --extra dev --extra runtime
      - run: docker pull python:3.12-slim
      - run: docker pull pgvector/pgvector:pg16
      - name: Required container kill and restart test
        run: uv run --frozen --extra dev --extra runtime pytest tests/docker --run-docker -q --junitxml=test-results/container-recovery.xml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: container-recovery-report
          path: test-results/container-recovery.xml

  backend:
    name: Python tests (${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - run: uv lock --check
      - run: uv sync --frozen --extra dev --extra runtime
      - name: Required runtime identity
        run: uv run --frozen --extra dev --extra runtime python -c "import importlib.metadata; import motoro; assert importlib.metadata.version('motoro') == '0.13.0'"
      - name: Lint
        run: uv run --frozen --extra dev --extra runtime ruff check src/ tests/integration tests/live tests/test_mcp_protocol.py tests/test_saved_skill_compatibility.py tests/test_research_input_matrix.py scripts/check_distribution.py scripts/check_runtime_distribution.py
      - name: Import boundaries
        run: uv run --frozen --extra dev --extra runtime lint-imports
      - name: Required control HTTP query routes
        run: uv run --frozen --extra dev --extra runtime pytest tests/test_control_query_routes.py -q
      - name: Unit, component and MCP protocol tests
        run: uv run --frozen --extra dev --extra runtime pytest -q --cov --cov-report=term --cov-report=xml --junitxml=test-results/python.xml
      - name: Public tree and Markdown
        run: |
          uv run --frozen --extra dev --extra runtime python scripts/check_release_readiness.py
          uv run --frozen --extra dev --extra runtime python scripts/check_public_tree.py
          uv run --frozen --extra dev --extra runtime python scripts/check_markdown.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: python-${{ matrix.python }}-reports
          path: |
            coverage.xml
            test-results/

  analysis:
    name: Python type and formatting diagnostics
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - run: uv sync --frozen --extra dev
      - name: Mypy
        run: uv run --frozen mypy src/memstara
      - name: Formatting
        run: uv run --frozen ruff format --check src/

  integration:
    name: PostgreSQL integration
    # This runner ships PostgreSQL 16. Avoid Docker Hub pulls before test startup.
    runs-on: ubuntu-24.04
    env:
      MEMSTARA_TEST_DATABASE_URL: postgresql://memstara_test:memstara_test@127.0.0.1:5432/memstara_test
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Start isolated runner PostgreSQL 16 test database
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16-pgvector
          sudo systemctl start postgresql.service
          test_pg_version=$(sudo -u postgres psql -Atc 'SHOW server_version_num')
          test "$test_pg_version" -ge 160000
          test "$test_pg_version" -lt 170000
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE memstara_test LOGIN SUPERUSER PASSWORD 'memstara_test'"
          sudo -u postgres createdb --owner=memstara_test memstara_test
          PGPASSWORD=memstara_test psql -h 127.0.0.1 -U memstara_test -d memstara_test -v ON_ERROR_STOP=1 -c 'SELECT version()'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - run: uv sync --frozen --extra dev --extra runtime
      - run: uv run --frozen --extra dev --extra runtime pytest tests/integration --run-integration -q --junitxml=test-results/postgres.xml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: postgres-reports
          path: test-results/

  frontend:
    name: Frontend unit, type, lint and browser tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: viewer/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: viewer/web/package-lock.json
      - run: npm ci
      - name: Audit frontend runtime and build dependencies
        run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-reports
          path: |
            viewer/web/playwright-report/
            viewer/web/test-results/

  responsive-ui:
    name: Responsive UI across browsers and zoom levels
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: viewer/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: viewer/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:responsive
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: responsive-ui-reports
          path: |
            viewer/web/responsive-report/
            viewer/web/test-results/

  package:
    name: Distribution build and installed version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen python -m build
      - run: uv run --frozen python scripts/check_distribution.py
      - name: Extracted source example inspection and registration
        run: uv run --frozen --extra runtime python scripts/check_source_distribution.py
      - name: Isolated locked-runtime wheel installation
        run: uv run --frozen python scripts/check_runtime_distribution.py
      - uses: actions/upload-artifact@v6
        with:
          name: distributions
          path: dist/
