name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]" build

      - name: Lint
        run: ruff check src/

      - name: Test
        run: pytest -q -ra

      - name: Public tree
        run: python scripts/check_public_tree.py

      - name: Markdown links
        run: python scripts/check_markdown.py

      - name: Build distributions
        run: python -m build
