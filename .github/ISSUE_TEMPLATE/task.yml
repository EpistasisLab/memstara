name: Task
description: A unit of Memstara work, split until all four questions can be answered
title: "· "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Describe one concrete change: what, why, how to verify completion,
        dependencies, and supporting evidence. Split work that cannot be checked
        as a single outcome into separate issues.

  - type: textarea
    id: what
    attributes:
      label: What
      description: What gets done. One change. If you need the word "and", consider two issues.
      placeholder: Add an all/any mode to the tags filter in okf_search, defaulting to the present any behaviour.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: Why it is worth doing. What is wrong now, or what becomes possible.
      placeholder: Describe the observed behavior and its impact; include a reproducible example.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: How we'll know it's done
      description: >
        The check that closes this. A command someone else can run, or an observation
        someone else can make. "It works" is not a check.
      placeholder: A regression test demonstrates the requested behavior and preserves the existing default.
    validations:
      required: true

  - type: textarea
    id: depends
    attributes:
      label: Depends on
      description: >
        What has to be true first — other issues, a decision, access to something.
        Write "Nothing" if nothing. Leaving it blank and leaving it empty are different
        answers, and only one of them is useful later.
      placeholder: Nothing.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: >
        file:line, a command's output, or a measurement — with the date it was taken.
        Cite the current source or recorded execution that supports the claim.
      placeholder: |
        Include the source revision, command, expected result, actual result,
        and measurement date. Label synthetic examples as examples.
    validations:
      required: false

  - type: dropdown
    id: label
    attributes:
      label: Kind
      description: Five labels, and no more. A sixth costs more to maintain than it explains.
      options:
        - bug
        - enhancement
        - research-decision
        - verification
        - housekeeping
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Size
      description: Same vocabulary as the ASAREE Roadmap board, so the two boards read the same way.
      options:
        - XS
        - S
        - M
        - L
        - XL
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 — blocks other work
        - P1
        - P2
        - P3
    validations:
      required: true
