name: memstara-tests
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: memstara_test
      POSTGRES_PASSWORD: memstara_test
      POSTGRES_DB: memstara_test
    ports:
      - '127.0.0.1:${MEMSTARA_TEST_POSTGRES_PORT:-55473}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U memstara_test -d memstara_test']
      interval: 2s
      timeout: 5s
      retries: 20
