# Memstara Viewer. Read-only over the two databases.
#
# The databases live in *other* compose projects — memstara-postgres in
# memstara, motoro-postgres in motoro — so they are reached
# through host.docker.internal rather than a shared network. Joining their networks
# would couple the viewer's lifecycle to theirs, and the viewer is an observer: it must
# be startable and stoppable without touching what it observes.
#
#     docker compose up -d --build     →  http://localhost:8070
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: memstara-viewer-api
    restart: unless-stopped
    environment:
      MEMSTARA_VIEWER_DSN: postgresql://memstara_viewer:viewer@host.docker.internal:5463/memstara
      CORE_VIEWER_DSN: postgresql://memstara_viewer:viewer@host.docker.internal:5453/motoro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8071:8000"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: memstara-viewer-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8070:80"
