server {
    listen 80;
    root /usr/share/nginx/html;

    # One origin for both, so the frontend uses the same relative /api paths in
    # development (via the Vite proxy) and in Docker. Two different base URLs would
    # mean one of them is always untested.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
