server {
    listen 80;
    root /usr/share/nginx/html;

    # One origin for both, so the frontend uses the same relative /api paths in
    # development (via the Vite proxy) and in Docker. Two different base URLs would
    # mean one of them is always untested.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # The control service is not a container. It runs on the host, in the sandbox's own
    # environment, because launching a pipeline needs `.venv`, `../motoro` and `.env` —
    # none of which this image has, and none of which it should. Reaching out of a
    # container to the host is the unusual direction, which is why it is spelled out
    # here rather than left to look like a sibling service.
    #
    # `host.docker.internal` is provided by Docker Desktop and already resolves in this
    # image; the service binds 127.0.0.1 on the host and is still reachable through it.
    # `Host $host` matters: the control service refuses a request that arrives under an
    # unfamiliar name, which is what a page pointing its own domain at 127.0.0.1 does.
    location /control/ {
        proxy_pass http://host.docker.internal:8072;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
    }

    location / {
        try_files $uri /index.html;
    }
}
