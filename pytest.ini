# `testpaths = tests` is deliberate, and widening it gains nothing.
#
# The root `test_blackboard.py` looks excluded by this line, but it is not a
# pytest file: it holds `cleanup`/`ok`/`main` and an `if __name__ == "__main__"`
# block, needs a live Postgres, and is run by hand as `python test_blackboard.py`.
# Setting `testpaths = tests .` was measured — it collects the same 64 tests and
# only adds an import of a database script. The name is what misleads; renaming it
# to `check_blackboard.py` is the real fix and touches 02_mvp_pipeline.py:348.
[pytest]
testpaths = tests
markers =
    unit: pure logic over a stubbed encoder — no model, no catalog, no filesystem
