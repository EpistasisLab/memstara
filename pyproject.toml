[project]
name = "memstara"
dynamic = ["version"]
description = "Memstara sandbox: the agentic ML pipeline, its MCP tool servers, and the shared blackboard."
readme = "README.md"
# The CI/runtime support matrix is Python 3.12 and 3.13. FastAPI 0.115.6
# conflicts with MCP 1.29+ Starlette requirements on Python 3.14+.
requires-python = ">=3.12,<3.14"

dependencies = [
    "pandas",
    "scikit-learn",
    "numpy",
    "xgboost",
    "psutil",
    "threadpoolctl",
    "shap==0.52.0",
    "lime==0.2.0.1",
    "python-dotenv",
    # Logging is imported directly by the control service and driver.
    "structlog",
    # The OKF adapter parses Markdown frontmatter directly.
    "PyYAML",
    # `src/memstara/blackboard.py:99` and `src/memstara/mcp_servers/blackboard.py:76`
    # import this at module top, so it is needed to *import* the MCP server, not just
    # to connect. Nothing else declared here brings it in — checked, not assumed:
    # `importlib.metadata.requires` for pandas, numpy, scikit-learn, python-dotenv and
    # mcp lists it nowhere. Only motoro was supplying it.
    "asyncpg",
    # `src/memstara/matcher/config.py:24`. This one does arrive anyway, because `mcp`
    # requires `pydantic<3.0.0,>=2.11.0`. Declared regardless: the matcher's config
    # models do not become optional because an unrelated package happens to need the
    # same library, and a resolver that ever drops that edge would break the matcher
    # for a reason with no visible connection to it.
    "pydantic",
    # Match Motoro v0.13.0's supported SDK range (>=1.29.0,<2.0.0). mcp 2.0.0
    # renames FastMCP and changes ClientSession's shutdown so a connected client hangs
    # on exit. Declaring it unpinned here would let a resolver walk this environment
    # straight into that, past the cap core wrote to prevent it.
    "mcp>=1.29.0,<2.0.0",
]

# `optional-dependencies`, not PEP 735 `[dependency-groups]` as motoro uses. motoro is
# installed with uv, which understands groups; this repository is a conda environment
# whose pip section installs with `pip install -e .[dev]`, and pip does not install
# dependency-groups from a path requirement.
[project.optional-dependencies]
pilot = ["shap==0.52.0", "lime==0.2.0.1"]
# Match the runtime used for the four-mode Haiku acceptance. A public clone can
# install this extra without a sibling checkout; runtime-dependent CI must use it.
runtime = [
    "motoro @ git+https://github.com/EpistasisLab/motoro.git@da2847c0321dd90a6f885f82399c2d579a7e08ee",
    "litellm==1.97.0",
    "boto3>=1.35,<2",  # Bedrock SigV4 and bearer-token request support.
    "torch==2.13.0",
]
dev = [
    # The test suite. Listed as a dependency, not an aside, because the matcher's claim
    # to be a faithful port of afc-forge rests on 31 upstream tests running unmodified —
    # an environment that cannot run them does not preserve that evidence.
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "mypy>=1.15",
    "import-linter>=2",
    "httpx",
    "build",
    # Offline viewer API tests import FastAPI; match viewer/requirements.txt.
    "fastapi==0.115.6",
    "debugpy",
    "ruff",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

# Hosted CI exercises CPU-bound synthetic workers, not GPU inference. Avoid CUDA
# wheels for Linux runtime tests; application deployments can use their own runtime.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/memstara/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/memstara"]

[tool.hatch.build.targets.sdist]
# Local design references are not application or release resources.
exclude = ["/photos"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "memstara/third_party/THIRD_PARTY_NOTICES.md"
"licenses/afc-forge-LICENSE.txt" = "memstara/third_party/licenses/afc-forge-LICENSE.txt"

# --------------------------------------------------------------------------- #
# pytest. This section replaces `pytest.ini`, which is deleted in the same commit.
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# The line this whole file exists for. Until now the tests found `tools_blackboard`,
# `tools_data` and `matcher_impl` only because pytest happened to be started from the
# repository root, which put the root on `sys.path` as rootdir. Saying so out loud
# means `pytest <repo>/tests` works from anywhere.
#
# There is no `pythonpath` here. There was one — `["."]` — for exactly one commit,
# while the modules still sat at the repository root. `pip install -e .` puts
# `src/memstara` on the path properly, so pytest needs no help.

markers = [
    "unit: deterministic logic without external services",
    "integration: real PostgreSQL tests; requires --run-integration and a test database",
    "protocol: real MCP subprocess transport with synthetic data",
    "live: paid Haiku 5.5 end-to-end acceptance; requires --run-live and configured services",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# E/F are pycodestyle and pyflakes: undefined names, unused imports, unreachable
# code — the findings that are bugs rather than taste. B is flake8-bugbear, which
# is where `zip()` without `strict=` gets caught. UP is pyupgrade; it reports
# nothing today, and is listed so that it keeps reporting nothing.
#
# `I` (isort) was selected, tried, and dropped. It found 14 files, and fixing
# them was not an improvement: the import blocks in this repository are grouped
# by hand under prose headers (`# ---- motoro (the repo next door) ----`), carry
# an aligned trailing comment per line explaining what each import is for, and in
# `src/memstara/pipeline/board.py` the comment above `from memstara.env import
# load_env` states that the order is load-bearing. isort moved two imports above
# that comment, orphaning it, and collapsed every alignment column in the file.
# Nothing isort reports here is a bug; what it costs is the one thing these files
# were written for, which is being readable by someone who does not write Python
# for a living.
select = ["E", "F", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The three files below are `SOURCE: PORTED FROM afc-forge`.
# Preserve their upstream behavior: the claim that
# this package is a faithful port rests entirely on a diff against upstream
# printing only what the PORT NOTEs declare
# (`src/memstara/matcher/__init__.py:1-4`), and a tidied import block is
# indistinguishable from a divergence in that diff.
#
# The one finding here is upstream's, and it is correct as it stands: the `torch`
# at `embedder.py:154` is imported for its side effect — it must load after the
# offline flag is flipped and before `sentence_transformers`, which is exactly
# why it is never referenced by name afterwards.
#
# `matcher.py` and `vocab.py` are clean today and are listed anyway, because the
# rule is about where the file came from rather than about what ruff happens to
# say this month. F401 is the code most likely to fire next on ported code, for
# the same reason it fired here.
#
# If some other rule fires on one of these files, the fix is to add its code to
# this list with a line saying what upstream does. It is never to edit the file.
# `catalog.py` is deliberately absent: it is `SOURCE: MIXED`, and its
# sandbox-original half from `catalog.py:190` onward is linted normally.
"src/memstara/matcher/matcher.py" = ["F401"]
"src/memstara/matcher/embedder.py" = ["F401"]
"src/memstara/matcher/vocab.py" = ["F401"]

[tool.coverage.run]
branch = true
source = ["memstara"]
omit = ["*/_version.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["_version.py"]

[tool.importlinter]
root_packages = ["memstara"]

[[tool.importlinter.contracts]]
name = "Matcher does not depend on orchestration"
type = "forbidden"
source_modules = ["memstara.matcher"]
forbidden_modules = ["memstara.control", "memstara.pipeline"]

[[tool.importlinter.contracts]]
name = "Foundational paths and labels do not depend on application layers"
type = "forbidden"
source_modules = ["memstara.paths", "memstara.agent_labels"]
forbidden_modules = ["memstara.control", "memstara.pipeline", "memstara.mcp_servers", "memstara.matcher"]

[[tool.importlinter.contracts]]
name = "Execution preparation does not depend on the board driver"
type = "forbidden"
source_modules = ["memstara.pipeline.preparation"]
forbidden_modules = ["memstara.pipeline.board"]
