# The sandbox, as an installable package.
#
# Why this file did not exist until now
# -------------------------------------
# Every peer repository has one — motoro, ASAREE, BaseAgent, tpot. This one did not,
# and that absence is what let `tests/` resolve its imports by accident: `pytest.ini`
# set no `pythonpath`, `tests/conftest.py` does no path work, yet
# `tests/test_board_columns.py:24` says `import tools_blackboard`. Run from the
# repository root that collects 67 tests; run from anywhere else it is 5 collection
# errors. Nothing was broken to repair — something was missing to add.
#
# This file is step 1 of `H-20` (issue #33). It moves nothing. The move into
# `src/memstara/` comes afterwards, and lands in a commit of its own.

[project]
name = "memstara"
# Written here rather than derived from a git tag. motoro uses hatch-vcs because a
# product pins it *by tag* and the release procedure would otherwise drift; this
# repository has no tags and nothing installs it from an index, so a version derived
# from `git describe` would say `0.1.dev<N>+g<sha>` and mean nothing to anyone.
version = "0.1.0"
description = "Memstara sandbox: the agentic ML pipeline, its MCP tool servers, and the shared blackboard."
readme = "README.md"
requires-python = ">=3.12"

# What the sandbox imports directly.
#
# This used to read "and motoro does not already bring in", which was the wrong rule.
# It was true of this machine, where `-e ../motoro` (`environment.yml:36`) installs
# asyncpg, pydantic, structlog, torch and the rest as a side effect. It is not true
# anywhere else, and "a neighbouring package happens to install it" is a fact about
# one environment, not a declaration. That is the same shape as the mistake recorded
# on the `mcp` line below: a version cap written in one file and relied on from
# another.
#
# `motoro` itself is deliberately absent. It is a local editable checkout at
# `../motoro`, not something a resolver can fetch, so it stays in `environment.yml`
# where the relative path belongs. Anyone who installs this package without motoro
# present will find out at the first `import motoro`, which is the honest failure.
#
# Still undeclared, on purpose: structlog, PyYAML, sentence-transformers, torch,
# huggingface_hub. Every one of them is reached only from a module that
# imports motoro anyway, or is imported lazily inside a function, so declaring them
# would not make this package standalone — it would only drag torch (~489MB,
# `environment.yml:20-22`) into every install. When one of those modules stops
# needing motoro, its dependency moves up here.
#
# **xgboost left that list on 2026-09-08** and is declared below. It was optional
# while the default engine was scikit-learn; it is not optional now that it *is* the
# default, and an undeclared package that every run needs is a checkout that installs
# cleanly and dies at the third stage.
dependencies = [
    "pandas",
    "scikit-learn",
    "numpy",
    # Default ML engine; the evaluation MCP also supports scikit-learn models.
    # Historical single-engine implementation:
    # (`src/memstara/mcp_servers/ml.py (at commit 0990ec5, lines 93)`). The 2.4MB arm64 wheel is why this is
    # affordable where torch is not — it pulls only numpy and scipy, both of which
    # scikit-learn already requires.
    #
    # scikit-learn stays declared above it and did not become dead weight when the two
    # scikit-learn engines were removed. It is down to two imports, both in
    # `train_and_score` (`src/memstara/mcp_servers/ml.py (at commit 0990ec5, lines 273-274)`) — `train_test_split`
    # and `roc_auc_score` — but those two produce every number this server reports, so
    # it is a hard requirement rather than a leftover. Nothing else in the repository
    # imports it; the matcher runs on numpy and sentence-transformers.
    "xgboost",
    "python-dotenv",
    # `src/memstara/blackboard.py:99` and `src/memstara/mcp_servers/blackboard.py:76`
    # import this at module top, so it is needed to *import* the MCP server, not just
    # to connect. Nothing else declared here brings it in — checked, not assumed:
    # `importlib.metadata.requires` for pandas, numpy, scikit-learn, python-dotenv and
    # mcp lists it nowhere. Only motoro was supplying it.
    "asyncpg",
    # `src/memstara/matcher/config.py:24`. This one does arrive anyway, because `mcp`
    # requires `pydantic<3.0.0,>=2.11.0`. Declared regardless: the matcher's config
    # models do not become optional because an unrelated package happens to need the
    # same library, and a resolver that ever drops that edge would break the matcher
    # for a reason with no visible connection to it.
    "pydantic",
    # Capped to match motoro's own cap exactly (`motoro/pyproject.toml:53`). mcp 2.0.0
    # renames FastMCP and changes ClientSession's shutdown so a connected client hangs
    # on exit. Declaring it unpinned here would let a resolver walk this environment
    # straight into that, past the cap core wrote to prevent it.
    "mcp>=1.27.1,<2.0.0",
]

# `optional-dependencies`, not PEP 735 `[dependency-groups]` as motoro uses. motoro is
# installed with uv, which understands groups; this repository is a conda environment
# whose pip section installs with `pip install -e .[dev]`, and pip does not install
# dependency-groups from a path requirement.
[project.optional-dependencies]
dev = [
    # The test suite. Listed as a dependency, not an aside, because the matcher's claim
    # to be a faithful port of afc-forge rests on 31 upstream tests running unmodified —
    # an environment that cannot run them does not preserve that evidence.
    "pytest",
    # The tool servers are child processes, so attaching a debugger to one needs this.

    "debugpy",
    # The linter, configured in `[tool.ruff]` below and run by
    # `.github/workflows/ci.yml`. Declared here rather than installed ad hoc so that
    # the version CI uses and the version this machine uses come from one place.
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memstara"]

# --------------------------------------------------------------------------- #
# pytest. This section replaces `pytest.ini`, which is deleted in the same commit.
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
# `testpaths = tests` is deliberate, and widening it gains nothing.
#
# This carries `pytest.ini`'s reasoning across. There used to be a `test_blackboard.py`
# at the repository root that looked excluded by this line, but it was never a pytest
# file: it holds `cleanup`/`ok`/`main` and an `if __name__ == "__main__"` block, needs a
# live Postgres, and is run by hand. Setting `testpaths = ["tests", "."]` was measured —
# it collects the same 67 tests and only adds an import of a database script. The name
# was what misled, so the file is now `scripts/check_blackboard.py`, renamed in the
# move commit along with its one call site, `src/memstara/pipeline/mvp.py:306`.
testpaths = ["tests"]

# The line this whole file exists for. Until now the tests found `tools_blackboard`,
# `tools_data` and `matcher_impl` only because pytest happened to be started from the
# repository root, which put the root on `sys.path` as rootdir. Saying so out loud
# means `pytest <repo>/tests` works from anywhere.
#
# There is no `pythonpath` here. There was one — `["."]` — for exactly one commit,
# while the modules still sat at the repository root. `pip install -e .` puts
# `src/memstara` on the path properly, so pytest needs no help.

markers = [
    "unit: pure logic over a stubbed encoder — no model, no catalog, no filesystem",
]

# --------------------------------------------------------------------------- #
# ruff. Run by `.github/workflows/ci.yml` as `ruff check src/`.
#
# There is no mypy here, and that is a decision rather than an omission: `src/`
# is 12,426 lines carrying no type hints, so `--strict` would produce thousands
# of findings and exactly one habit, which is ignoring the output. Adding types
# is a piece of work with its own backlog item, not a flag to switch on.
#
# The scope is `src/`, and it is set by the command rather than by an `exclude`
# here, so that a deliberate `ruff check scripts/` still works. `scripts/` is
# one-off tooling written to be read rather than reused, and `tests/` carries
# ported afc-forge tests that are evidence only while they stay unmodified

# they were not written to, for no gain.
# --------------------------------------------------------------------------- #
[tool.ruff]
# Measured, not chosen. The distribution of line lengths across `src/` on
# 2026-09-01: median 45, p90 87, p95 90, p99 106, longest 182. At 100 ruff
# reports 85 lines; at 110, 20; at 120, exactly one
# (`src/memstara/trace/__init__.py:7`). 120 is therefore the limit that gates
# what gets written next instead of generating a backlog of reflowing existing
# prose — and a limit that produces 85 findings on day one is a limit that gets
# added to `ignore` within a week.
line-length = 120

[tool.ruff.lint]
# E/F are pycodestyle and pyflakes: undefined names, unused imports, unreachable
# code — the findings that are bugs rather than taste. B is flake8-bugbear, which
# is where `zip()` without `strict=` gets caught. UP is pyupgrade; it reports
# nothing today, and is listed so that it keeps reporting nothing.
#
# `I` (isort) was selected, tried, and dropped. It found 14 files, and fixing
# them was not an improvement: the import blocks in this repository are grouped
# by hand under prose headers (`# ---- motoro (the repo next door) ----`), carry
# an aligned trailing comment per line explaining what each import is for, and in
# `src/memstara/pipeline/board.py` the comment above `from memstara.env import
# load_env` states that the order is load-bearing. isort moved two imports above
# that comment, orphaning it, and collapsed every alignment column in the file.
# Nothing isort reports here is a bug; what it costs is the one thing these files
# were written for, which is being readable by someone who does not write Python
# for a living.
select = ["E", "F", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The three files below are `SOURCE: PORTED FROM afc-forge`, and

# this package is a faithful port rests entirely on a diff against upstream
# printing only what the PORT NOTEs declare
# (`src/memstara/matcher/__init__.py:44-48`), and a tidied import block is
# indistinguishable from a divergence in that diff.
#
# The one finding here is upstream's, and it is correct as it stands: the `torch`
# at `embedder.py:154` is imported for its side effect — it must load after the
# offline flag is flipped and before `sentence_transformers`, which is exactly
# why it is never referenced by name afterwards.
#
# `matcher.py` and `vocab.py` are clean today and are listed anyway, because the
# rule is about where the file came from rather than about what ruff happens to
# say this month. F401 is the code most likely to fire next on ported code, for
# the same reason it fired here.
#
# If some other rule fires on one of these files, the fix is to add its code to
# this list with a line saying what upstream does. It is never to edit the file.
# `catalog.py` is deliberately absent: it is `SOURCE: MIXED`, and its
# sandbox-original half from `catalog.py:190` onward is linted normally.
"src/memstara/matcher/matcher.py" = ["F401"]
"src/memstara/matcher/embedder.py" = ["F401"]
"src/memstara/matcher/vocab.py" = ["F401"]
