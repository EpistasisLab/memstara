server {
    listen 80;
    root /usr/share/nginx/html;
    auth_basic "Memstara";
    auth_basic_user_file /etc/nginx/memstara.htpasswd;
    location @unavailable {
        default_type application/json;
        return 503 '{"error":"Service is starting or unavailable. Saved results are retained."}';
    }
    # Large downloads are prepared before headers and streamed as binary files.
    location = /api/experiments/prepare-download {
        proxy_set_header Authorization "";
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_intercept_errors off;
    }
    location /api/experiments/prepared-file/ {
        proxy_set_header Authorization "";
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_intercept_errors off;
    }
    location = /api/experiments/linked-download {
        proxy_set_header Authorization "";
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 180s;
        # Preserve the export API's actionable errors (registry, archive, busy,
        # preparation failure). Replacing its 503 hides the reason for a failed CSV.
        proxy_intercept_errors off;
    }
    location /api/ {
        proxy_set_header Authorization "";
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 502 503 504 = @unavailable;
    }
    location /control/ {
        proxy_set_header Authorization "";
        client_max_body_size 7m;
        proxy_pass http://control:8072;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_intercept_errors on;
        error_page 502 503 504 = @unavailable;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
