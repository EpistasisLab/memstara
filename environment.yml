# The conda environment the Memstara sandbox runs in.
#
#     conda env create -f environment.yml
#     conda activate memstara
#
# If it already exists:
#
#     conda env update -f environment.yml --prune
#
# Why almost everything is pip
# ----------------------------
# conda supplies python and nothing else; the rest goes in through pip. `motoro` is a
# local source (it cannot be on a conda channel), and it is what pulls in litellm, mcp
# and sentence-transformers — all of which are newer on PyPI than on conda-forge, so
# versions coming from two places are hard to reconcile once they diverge. Letting one
# resolver settle the whole thing is easier to reproduce.
#
# `-e ../motoro` is editable — edit core's source and it takes effect without
# reinstalling. The path is relative, so this must be run **from the folder this file is
# in**.
#
# Weight: torch is about 489MB, which puts the whole environment around 1GB.
# sentence-transformers is a direct dependency of motoro, and it is what drags torch in.
# It takes the disk even if only remote models are ever used — core's own pyproject
# comment already says as much.

name: memstara

channels:
  - conda-forge

dependencies:
  # 3.12 — kept on the same series as motoro's own .venv.
  - python=3.12
  - pip

  - pip:
      # Local source. This one line brings pydantic, sqlalchemy, asyncpg, alembic,
      # redis, pgvector, sentence-transformers, litellm, instructor and tenacity with it.
      - -e ../motoro

      # The sandbox itself, editable, with its test and debug extras.
      #
      # This one line replaces the list of pandas / scikit-learn / numpy /
      # python-dotenv / mcp / pytest / debugpy that used to sit here. They are declared
      # in `pyproject.toml` now, with the reason for each. Two places to edit is how
      # `mcp` came to be capped at <2.0.0 in motoro and left unpinned here — the cap
      # core wrote to stop a resolver breaking MCP shutdown did not apply to the
      # environment that actually runs the servers.
      - -e .[dev]
